<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artisan Gallery - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-lg border-0 hover-card p-4" style="max-width: 420px; width: 100%;">
    <div class="card-body">
      <h3 class="card-title text-center fw-bold mb-3">Create Account</h3>
      <p class="text-center text-muted small mb-4">Join our community of art enthusiasts</p>
      <form action="gallery.html">
        <div class="mb-3">
          <label class="form-label small text-uppercase fw-semibold">Full Name</label>
          <input type="text" class="form-control" placeholder="John Doe">
        </div>
        <div class="mb-3">
          <label class="form-label small text-uppercase fw-semibold">Email address</label>
          <input type="email" class="form-control" placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label small text-uppercase fw-semibold">Password</label>
          <input type="password" class="form-control" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-dark w-100 mt-2 py-2">Create Account</button>
      </form>
      <div class="text-center mt-3">
        <span class="small text-muted">Already have an account? </span>
        <a href="index.html" class="small text-decoration-none fw-bold text-primary">Log In</a>
      </div>
    </div>
  </div>
</body>
</html>
